version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      mikro-orm:
        patterns: ["@mikro-orm/*"]
      nuxt:
        patterns: ["nuxt", "@nuxt/*", "@vite-pwa/*", "vite-plugin-pwa"]
      lint-test:
        patterns:
          ["eslint", "@eslint/*", "typescript-eslint", "prettier", "vitest", "@commitlint/*"]
    ignore:
      # TypeScript 7 (native) has no JS API yet: typescript-eslint and vue-tsc need 6.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
