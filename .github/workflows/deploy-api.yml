# Builds the API image, pushes it to GHCR, runs the migrations and deploys it on Render.
# main → environment "production"; develop → "staging", only when the variable STAGING_ENABLED is "true".
name: Deploy API

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/micheledinocera/calories-diary-api

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    if: github.ref_name == 'main' || (github.ref_name == 'develop' && vars.STAGING_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          # Moving tag per environment (the one set on the Render service) + the commit, used by the deploy hook.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # From the image just pushed, so the migrations match the code being deployed.
      # The CLI validates the whole env: values it does not use for migrations are placeholders.
      - name: Migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL_DIRECT" \
            -e DATABASE_URL_DIRECT \
            -e REDIS_URL=redis://non-usato:6379 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e OFF_CONTATTO=deploy@example.com \
            "$IMAGE:$GITHUB_SHA" node dist/src/db/cli.js migration:up

      - name: Deploy on Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -G --data-urlencode "imgURL=$IMAGE:$GITHUB_SHA" "$RENDER_DEPLOY_HOOK"

      # Render pulls the image and starts it (plus the cold start on Free): wait until /health reports this commit.
      - name: Smoke test
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 40); do
            health=$(curl -fsS --max-time 30 "$API_URL/health" || true)
            echo "[$i] $health"
            if [ "$(echo "$health" | jq -r '.stato + " " + .versione' 2>/dev/null)" = "ok $GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::/health non risponde con la versione $GITHUB_SHA dopo 10 minuti"
          exit 1
